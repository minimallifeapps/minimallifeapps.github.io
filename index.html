<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minimal Life Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0b0c; --card: #161618; --text: #e8e6e1; --dim: rgba(232,230,225,.6); --border: rgba(255,255,255,.07); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "VT323", ui-monospace, Menlo, monospace; font-size: 22px; line-height: 1.35; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-weight: 400; font-size: 44px; margin: 0 0 4px; text-shadow: 0 0 6px rgba(232,230,225,.3); }
  .meta { color: var(--dim); margin: 0 0 32px; }
  .app { display: flex; gap: 18px; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 18px 20px; }
  .app img { width: 72px; height: 72px; border-radius: 16px; }
  .app h2 { font-weight: 400; font-size: 28px; margin: 0; }
  .app p { color: var(--dim); margin: 2px 0 6px; }
  a { color: var(--text); }
  footer { color: var(--dim); margin-top: 32px; }
</style>
</head>
<body>
<main>
  <h1>MINIMAL LIFE APPS_</h1>
  <p class="meta">Small, private apps for what matters.</p>
  <div class="app">
    <img src="my-life-list/icon.png" alt="My Life List icon">
    <div>
      <h2>MY LIFE LIST</h2>
      <p>Three lists. Nothing else.</p>
      <a href="my-life-list/privacy/">Privacy Policy</a>
    </div>
  </div>
  <footer>Contact: <a href="mailto:minimallifeapps@gmail.com">minimallifeapps@gmail.com</a></footer>
</main>
</body>
</html>
